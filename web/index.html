<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocBrain · 本地文档问答</title>
<style>
:root {
  --bg: #f5f7fa; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280;
  --accent: #2563eb; --accent-soft: #eff6ff; --border: #e5e7eb;
  --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }

header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
header .logo { font-size: 18px; font-weight: 700; }
header .logo .brain { color: var(--accent); }
header .sub { color: var(--muted); font-size: 12px; }
header .health { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }

.layout { flex: 1; display: flex; overflow: hidden; }

/* ── 侧栏 ── */
aside { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.side-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.side-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; margin-bottom: 10px; text-transform: uppercase; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; transition: .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: #fff; color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.url-row { display: flex; gap: 8px; margin-top: 10px; }
.url-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.url-row input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.doc-list { flex: 1; overflow-y: auto; padding: 8px; }
.doc-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: .15s; position: relative; background: #fff; }
.doc-item:hover { border-color: var(--accent); }
.doc-item.active { border-color: var(--accent); background: var(--accent-soft); }
.doc-item .name { font-size: 13px; font-weight: 600; word-break: break-all; padding-right: 22px; }
.doc-item .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.badge { background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; font-size: 10px; }
.badge.ocr { background: #fef3c7; color: #92400e; }
.doc-item .del { position: absolute; top: 8px; right: 8px; color: #d1d5db; cursor: pointer; font-size: 14px; line-height: 1; }
.doc-item .del:hover { color: var(--err); }
.scope-hint { padding: 8px 16px; font-size: 11px; color: var(--muted); }

/* ── 主区 ── */
main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.empty { margin: auto; text-align: center; color: var(--muted); }
.empty .icon { font-size: 44px; margin-bottom: 10px; }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.empty p { font-size: 13px; }

.qa { max-width: 860px; width: 100%; margin: 0 auto; }
.q-bubble { background: var(--accent); color: #fff; padding: 10px 16px; border-radius: var(--radius) var(--radius) 4px var(--radius); font-size: 14px; display: inline-block; max-width: 85%; word-break: break-word; }
.a-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-top: 10px; box-shadow: var(--shadow); }
.a-card.refused { border-color: #fcd34d; background: #fffbeb; }
.a-text { font-size: 14px; line-height: 1.75; word-break: break-word; white-space: pre-wrap; }
.a-text sup.cite { color: var(--accent); font-weight: 700; cursor: pointer; margin: 0 2px; }
.a-text sup.cite:hover { text-decoration: underline; }
.refuse-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warn); font-weight: 600; margin-bottom: 8px; }
.cite-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.cite-chip { border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; background: #fafafa; color: var(--ink); }
.cite-chip:hover { border-color: var(--accent); color: var(--accent); }
.cite-chip .lbl { color: var(--accent); font-weight: 700; margin-right: 4px; }
.a-meta { margin-top: 12px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

.composer { border-top: 1px solid var(--border); background: var(--panel); padding: 16px 24px; }
.composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; font-family: inherit; min-height: 48px; max-height: 160px; line-height: 1.5; }
.composer textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.composer .btn { height: 48px; padding: 0 22px; }
.composer .hint { max-width: 860px; margin: 6px auto 0; font-size: 11px; color: var(--muted); }
.spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 原文抽屉 ── */
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: none; z-index: 40; }
.drawer { position: fixed; top: 0; right: -480px; width: 460px; max-width: 92vw; height: 100vh; background: var(--panel); z-index: 50; box-shadow: -8px 0 30px rgba(0,0,0,.12); transition: right .25s ease; display: flex; flex-direction: column; }
.drawer.open { right: 0; }
.drawer-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.drawer-head .t { font-weight: 700; font-size: 14px; }
.drawer-head .close { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 18px; }
.drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
.src-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.src-text { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.src-dl { margin-top: 12px; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 60; display: none; max-width: 80vw; }
@media (max-width: 800px) { aside { width: 240px; } }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="brain">🧠</span> DocBrain</div>
  <div class="sub">本地文档问答 · 数据不出机器</div>
  <div class="health"><span class="dot" id="health-dot"></span><span id="health-text">检查中…</span></div>
</header>

<div class="layout">
  <aside>
    <div class="side-section">
      <div class="side-title">添加文档</div>
      <button class="btn" id="upload-btn" style="width:100%">📄 上传文件（PDF / Word / MD / TXT）</button>
      <input type="file" id="file-input" accept=".pdf,.docx,.md,.markdown,.txt" style="display:none">
      <div class="url-row">
        <input type="url" id="url-input" placeholder="https:// 网页链接">
        <button class="btn ghost" id="url-btn">导入</button>
      </div>
    </div>
    <div class="side-title" style="padding:12px 16px 4px">文档库</div>
    <div class="doc-list" id="doc-list"></div>
    <div class="scope-hint">点击文档可限定提问范围；再次点击取消。</div>
  </aside>

  <main>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <div class="icon">🗂️</div>
        <h3>开始使用 DocBrain</h3>
        <p>左侧上传文档或导入网页后，即可在下方提问。<br>回答中的 <b>[n]</b> 编号可点击查看原文片段与页码。</p>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="q-input" placeholder="针对文档库提问…（Ctrl+Enter 发送）" rows="1"></textarea>
        <button class="btn" id="ask-btn">提问</button>
      </div>
      <div class="hint">混合检索（BM25 + 向量）→ cross-encoder 重排 → 本地 LLM 生成；证据不足时将拒答而非编造。</div>
    </div>
  </main>
</div>

<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="t">原文片段</span>
    <span class="close" id="drawer-close">✕</span>
  </div>
  <div class="drawer-body">
    <div class="src-meta" id="src-meta"></div>
    <div class="src-text" id="src-text"></div>
    <div class="src-dl" id="src-dl"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let docs = [];
let scopeDocId = null;
let asking = false;
let lastCitations = [];

/* ── 工具 ── */
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = j.detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500);
}
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }

/* ── 健康检查 ── */
async function checkHealth() {
  const dot = $('health-dot'), text = $('health-text');
  try {
    const h = await api('/api/health');
    const ok = h.ollama;
    dot.className = 'dot ' + (ok ? 'ok' : 'bad');
    text.textContent = ok ? `服务正常 · ${h.documents} 篇文档 · ${h.chunks} 个片段` : '推理服务未就绪';
  } catch {
    dot.className = 'dot bad'; text.textContent = 'API 不可用';
  }
}

/* ── 文档库 ── */
async function loadDocs() {
  try { docs = await api('/api/documents'); } catch { docs = []; }
  renderDocs();
}
function renderDocs() {
  const list = $('doc-list');
  if (!docs.length) {
    list.innerHTML = '<div style="padding:14px;color:var(--muted);font-size:12px">暂无文档</div>';
    return;
  }
  list.innerHTML = docs.map(d => `
    <div class="doc-item ${scopeDocId === d.doc_id ? 'active' : ''}" data-id="${d.doc_id}">
      <div class="name">${escapeHtml(d.name)}</div>
      <div class="meta">
        <span>${d.chunks} 块</span>
        ${d.pages ? `<span>${d.pages} 页</span>` : ''}
        ${d.ocr_pages ? `<span class="badge ocr">OCR ${d.ocr_pages} 页</span>` : ''}
        ${d.source_url ? '<span class="badge">网页</span>' : ''}
      </div>
      <span class="del" data-del="${d.doc_id}" title="删除">✕</span>
    </div>`).join('');
  list.querySelectorAll('.doc-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.del) return;
      scopeDocId = scopeDocId === el.dataset.id ? null : el.dataset.id;
      renderDocs();
    });
  });
  list.querySelectorAll('.del').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('确认删除该文档及其索引？')) return;
      try {
        await api(`/api/documents/${el.dataset.del}`, { method: 'DELETE' });
        if (scopeDocId === el.dataset.del) scopeDocId = null;
        await loadDocs(); checkHealth();
      } catch (err) { toast('删除失败：' + err.message); }
    });
  });
}

/* ── 上传 / URL 导入 ── */
$('upload-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $('upload-btn').disabled = true;
  $('upload-btn').innerHTML = '<span class="spinner"></span> 解析入库中…';
  try {
    const fd = new FormData(); fd.append('file', file);
    const meta = await api('/api/documents/upload', { method: 'POST', body: fd });
    toast(`已入库：${meta.name}（${meta.chunks} 块${meta.ocr_pages ? `，OCR ${meta.ocr_pages} 页` : ''}，${meta.elapsed_s}s）`);
    await loadDocs(); checkHealth();
  } catch (err) { toast('入库失败：' + err.message); }
  $('upload-btn').disabled = false;
  $('upload-btn').innerHTML = '📄 上传文件（PDF / Word / MD / TXT）';
  e.target.value = '';
});
$('url-btn').addEventListener('click', async () => {
  const url = $('url-input').value.trim();
  if (!url) return;
  try {
    const meta = await api('/api/documents/web', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    toast(`已导入网页：${meta.name}（${meta.chunks} 块）`);
    $('url-input').value = '';
    await loadDocs(); checkHealth();
  } catch (err) { toast('导入失败：' + err.message); }
});

/* ── 问答 ── */
async function ask() {
  const q = $('q-input').value.trim();
  if (!q || asking) return;
  asking = true;
  $('ask-btn').innerHTML = '<span class="spinner"></span> 思考中';
  $('empty')?.remove();
  appendQuestion(q);
  const ansEl = appendAnswerPlaceholder();
  try {
    const body = { question: q };
    if (scopeDocId) body.doc_ids = [scopeDocId];
    const res = await api('/api/query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    renderAnswer(ansEl, res);
  } catch (err) {
    ansEl.querySelector('.a-text').textContent = '请求失败：' + err.message;
    ansEl.classList.add('refused');
  }
  $('q-input').value = ''; autoGrow($('q-input'));
  $('ask-btn').innerHTML = '提问';
  asking = false;
  $('messages').scrollTop = $('messages').scrollHeight;
}
$('ask-btn').addEventListener('click', ask);
$('q-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
});
$('q-input').addEventListener('input', (e) => autoGrow(e.target));

function appendQuestion(q) {
  const div = document.createElement('div');
  div.className = 'qa';
  div.innerHTML = `<div><div class="q-bubble">${escapeHtml(q)}</div></div>`;
  $('messages').appendChild(div);
  return div;
}
function appendAnswerPlaceholder() {
  const div = document.createElement('div');
  div.className = 'qa';
  div.innerHTML = `
    <div class="a-card">
      <div class="a-text"><span class="spinner" style="border-color:#cbd5e1;border-top-color:var(--accent);display:inline-block"></span> 检索与推理中…（本地模型，可能需要数十秒）</div>
    </div>`;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
  return div.querySelector('.a-card');
}

function renderAnswer(card, res) {
  lastCitations = res.citations || [];
  card.classList.toggle('refused', !!res.refused);

  // 回答文本：[n] → 可点击引用角标
  const html = escapeHtml(res.answer).replace(/\[(\d+)\]/g, (m, n) => {
    const has = lastCitations.some(c => c.label === Number(n));
    return has ? `<sup class="cite" data-label="${n}">[${n}]</sup>` : `<span style="color:var(--muted)">[${n}]</span>`;
  });

  const chips = lastCitations.map(c => `
    <div class="cite-chip" data-label="${c.label}">
      <span class="lbl">[${c.label}]</span>${escapeHtml(c.doc_name)}${c.page ? ` · 第${c.page}页` : ''}
    </div>`).join('');

  const t = res.timings || {};
  const isSmalltalk = res.mode === 'smalltalk';

  // 检索情况：拒答时也展示真实召回量，避免"检索 0 片段"误导用户以为系统坏了
  let retrieveInfo;
  if (isSmalltalk) {
    retrieveInfo = '未检索（寒暄直答）';
  } else if (res.refused && res.candidates > 0) {
    retrieveInfo = `召回 ${res.candidates} 个候选片段，最高相关度 ${Number(res.top_score).toFixed(3)}` +
      (res.refuse_threshold != null ? ` &lt; 阈值 ${res.refuse_threshold}` : '');
  } else if (res.refused) {
    retrieveInfo = '未召回候选片段';
  } else {
    retrieveInfo = `送入 ${res.retrieved} 片段（召回 ${res.candidates || res.retrieved}）${res.reranked ? ' · 已重排' : ''}`;
  }

  card.innerHTML = `
    ${res.refused ? '<div class="refuse-tag">⚠️ 证据不足 · 拒答（未编造）</div>' : ''}
    <div class="a-text">${html}</div>
    ${chips ? `<div class="cite-chips">${chips}</div>` : ''}
    <div class="a-meta">
      <span>${retrieveInfo}</span>
      ${t.total_ms ? `<span>总耗时 ${(t.total_ms / 1000).toFixed(1)}s</span>` : ''}
      ${t.retrieve_ms ? `<span>检索 ${(t.retrieve_ms / 1000).toFixed(1)}s</span>` : ''}
      ${t.llm_ms ? `<span>生成 ${(t.llm_ms / 1000).toFixed(1)}s</span>` : ''}
      ${res.models?.llm ? `<span>${escapeHtml(res.models.llm)}</span>` : ''}
    </div>`;

  card.querySelectorAll('sup.cite, .cite-chip').forEach(el => {
    el.addEventListener('click', () => openCitation(Number(el.dataset.label)));
  });
}

/* ── 引用溯源抽屉 ── */
function openCitation(label) {
  const c = lastCitations.find(x => x.label === label);
  if (!c) return;
  $('src-meta').innerHTML = `
    <span style="font-weight:600;color:var(--ink)">${escapeHtml(c.doc_name)}</span>
    ${c.page ? `<span class="badge">第 ${c.page} 页</span>` : '<span class="badge">无页码（非 PDF）</span>'}
    <span class="badge">相关度 ${(c.score ?? 0).toFixed ? c.score.toFixed(2) : c.score}</span>`;
  $('src-text').textContent = c.text || '（无内容）';
  $('src-dl').innerHTML = c.doc_id
    ? `<a class="btn ghost small" href="/api/documents/${c.doc_id}/file" target="_blank">⬇ 下载原文档</a>` : '';
  $('drawer').classList.add('open');
  $('drawer-mask').style.display = 'block';
}
function closeDrawer() {
  $('drawer').classList.remove('open');
  $('drawer-mask').style.display = 'none';
}
$('drawer-close').addEventListener('click', closeDrawer);
$('drawer-mask').addEventListener('click', closeDrawer);

/* ── 初始化 ── */
checkHealth(); loadDocs();
setInterval(checkHealth, 30000);
</script>
</body>
</html>
