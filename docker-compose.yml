name: docbrain

services:
  # ── 向量库 ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docbrain-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # ── 本地推理服务（数据不出机器）─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: docbrain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # 有 NVIDIA GPU 时取消以下注释以启用加速：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── 首次启动自动拉取模型（bge-m3 嵌入 + qwen2.5 生成）───
  ollama-init:
    image: curlimages/curl:latest
    container_name: docbrain-ollama-init
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '==> 拉取模型（首次约需数分钟到数十分钟，取决于网络）...'
      && (curl -s http://ollama:11434/api/pull -d '{\"model\": \"${DOCBRAIN_EMBED_MODEL:-bge-m3}\"}' || echo 'warn: bge-m3 拉取失败')
      && (curl -s http://ollama:11434/api/pull -d '{\"model\": \"${DOCBRAIN_LLM_MODEL:-qwen2.5:7b}\"}' || echo 'warn: LLM 拉取失败')
      && echo '==> 模型就绪'"

  # ── 后端 API ───────────────────────────────────────────
  api:
    build: .
    container_name: docbrain-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DOCBRAIN_QDRANT_URL: http://qdrant:6333
      DOCBRAIN_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Web UI（静态页面 + 反向代理到 api）─────────────────
  web:
    image: nginx:alpine
    container_name: docbrain-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_models:
